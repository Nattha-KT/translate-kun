[package]
name = "kun-core"
description = "Core logic for kun, the translate-kun CLI translator"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
keyring = "4.2.0"
# Not called directly. It caps the log level for the whole build: ureq-proto
# logs raw request headers and bodies (API key, source text) at TRACE, so TRACE
# must be compiled out. Feature unification applies this to every crate, and
# the `release_` variant wins over any `release_max_level_trace` elsewhere.
log = { version = "0.4.35", features = ["max_level_debug", "release_max_level_debug"] }
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.1"
ureq = { version = "3.5.2", features = ["json"] }

[features]
# Tests that call real Provider APIs. Never enabled in CI:
# `cargo test -p kun-core --features live`
live = []

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
