name: Scorecard

# OpenSSF Scorecard: an automated, public score of this repository's security
# practices. Results are published to https://scorecard.dev and shown as a
# badge in README.md. See https://github.com/ossf/scorecard-action
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 2"
  branch_protection_rule:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # A job-level block replaces the workflow-level one, so checkout needs this.
      contents: read
      # Upload the results to the code scanning tab.
      security-events: write
      # Publish the results and get the badge (OIDC token).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
