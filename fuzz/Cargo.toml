[package]
name = "translate-kun-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
translate-kun-core = { path = "../crates/kun-core" }

# This crate is its own workspace root. It is NOT a member of the main
# workspace, so `cargo test --workspace` never builds it and never needs nightly.
[workspace]

[[bin]]
name = "secret_guard"
path = "fuzz_targets/secret_guard.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_parse"
path = "fuzz_targets/config_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protected_terms"
path = "fuzz_targets/protected_terms.rs"
test = false
doc = false
bench = false
