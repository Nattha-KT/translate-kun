[package]
name = "translate-kun"
description = "kun: a command-line translator for developers, with a Secret Guard that keeps credentials out of translation requests"
keywords = ["translate", "translation", "cli", "thai", "i18n"]
categories = ["command-line-utilities", "localization", "internationalization"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
# Test fixtures contain fake, secret-looking strings. Do not ship them.
exclude = ["tests/"]

[[bin]]
name = "kun"
path = "src/main.rs"

[features]
# Lets `--provider fake` select the offline fake Provider. Only for tests:
# it must never be a default feature.
fake-provider = []

[dependencies]
translate-kun-core.workspace = true
clap.workspace = true
# `kun completions <shell>`.
clap_complete.workspace = true
# Hidden key input for `kun auth login`.
rpassword.workspace = true
# `--json` output.
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
# Temp directories to isolate HOME / XDG_CONFIG_HOME in integration tests
# (already in Cargo.lock through translate-kun-core's dev-dependencies).
tempfile.workspace = true

[lints]
workspace = true
