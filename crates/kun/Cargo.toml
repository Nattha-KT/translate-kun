[package]
name = "kun"
description = "A command-line translator for developers"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kun"
path = "src/main.rs"

[features]
# Lets `--provider fake` select the offline fake Provider. Only for tests:
# it must never be a default feature.
fake-provider = []

[dependencies]
kun-core = { path = "../kun-core" }
clap = { version = "4", features = ["derive"] }
# Hidden key input for `kun auth login`.
rpassword = "7"
# `--json` output.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
# Temp directories to isolate HOME / XDG_CONFIG_HOME in integration tests
# (already in Cargo.lock through kun-core's dev-dependencies).
tempfile = "3.27.0"

[lints]
workspace = true
