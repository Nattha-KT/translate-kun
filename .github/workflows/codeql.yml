name: CodeQL

# Static analysis (SAST) of the Rust code with GitHub CodeQL. Results appear
# in the repository's code scanning tab.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 3"

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (rust)
    runs-on: ubuntu-latest
    permissions:
      # A job-level block replaces the workflow-level one, so checkout needs this.
      contents: read
      # Upload the results to the code scanning tab.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: rust
          build-mode: none
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:rust"
