name: Publish crates

# Publishes `translate-kun-core` and then `translate-kun` to crates.io when a
# GitHub Release is published. A pre-release (for example `v0.1.0-rc.1`) is
# skipped. Authentication uses crates.io Trusted Publishing (OIDC): there is no
# long-lived token anywhere. See docs/development/releasing.md for the one-time
# crates.io setup (repository `machngai/translate-kun`, workflow
# `publish-crates.yml`).
#
# A crate version that is already on crates.io is skipped, so a rerun is safe.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    # `workflow_dispatch` is the owner's manual retry: run it from the release tag.
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted Publishing: exchange the GitHub OIDC token for a short-lived
      # crates.io token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - name: Check that the tag matches the crate version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "translate-kun") | .version')"
          if [ "$TAG" != "v$version" ]; then
            echo "Release tag $TAG does not match the crate version v$version" >&2
            exit 1
          fi
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Publish translate-kun-core, then translate-kun
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          for crate in translate-kun-core translate-kun; do
            version="$(cargo metadata --no-deps --format-version 1 | jq -r --arg name "$crate" '.packages[] | select(.name == $name) | .version')"
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' --user-agent 'translate-kun-publish-workflow' "https://crates.io/api/v1/crates/$crate/$version")"
            if [ "$status" = "200" ]; then
              echo "$crate $version is already on crates.io: skipping"
            elif [ "$status" = "404" ]; then
              echo "Publishing $crate $version"
              cargo publish -p "$crate" --locked
            else
              echo "Unexpected crates.io answer $status for $crate $version" >&2
              exit 1
            fi
          done
