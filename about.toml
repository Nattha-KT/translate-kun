# cargo-about configuration: builds THIRD-PARTY-LICENSES for the release
# archives (see docs/development/releasing.md). Run locally with:
#   cargo about generate --config about.toml about.hbs --output-file THIRD-PARTY-LICENSES.md
#
# `accepted` must stay the same as `[licenses] allow` in deny.toml, so a licence
# that cargo-deny rejects cannot slip into a release, and the other way round.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

# Only the platforms we ship, so Linux-only crates (keyring's Secret Service
# stack) and Windows-only crates are counted, and nothing else.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

# Dev-dependencies (test helpers) never reach the binary.
ignore-dev-dependencies = true
