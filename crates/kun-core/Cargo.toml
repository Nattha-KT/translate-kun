[package]
name = "translate-kun-core"
description = "Core logic for kun, the translate-kun CLI translator: Providers, Secret Guard, Protected Terms and config loading"
keywords = ["translate", "translation", "cli", "thai", "i18n"]
categories = ["command-line-utilities", "localization", "internationalization"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
# Test fixtures contain fake, secret-looking strings. Do not ship them.
exclude = ["tests/"]

# The package is `translate-kun-core`; the library keeps the short name so
# `use kun_core::...` works everywhere.
[lib]
name = "kun_core"

[dependencies]
keyring.workspace = true
log.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
ureq.workspace = true

[features]
# Tests that call real Provider APIs. Never enabled in CI:
# `cargo test -p translate-kun-core --features live`
live = []

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
