name: Publish crates

# Publishes `translate-kun-core` and then `translate-kun` to crates.io, through
# crates.io Trusted Publishing (OIDC): there is no long-lived token anywhere.
#
# How it runs:
# - Normally it is called by release.yml as a cargo-dist custom publish job
#   (`publish-jobs` in dist-workspace.toml). cargo-dist skips that job for
#   pre-releases, so a `-rc` tag never reaches crates.io. A GitHub Release made
#   by a workflow with GITHUB_TOKEN does not trigger `release: published`
#   workflows, which is why this is a called workflow and not a release trigger.
# - `workflow_dispatch` is the owner's manual retry: run it from the release tag
#   (Run workflow -> "Use workflow from" -> the tag).
#
# crates.io checks the *calling* workflow, so each crate needs two Trusted
# Publishing entries on crates.io: `release.yml` (normal path) and
# `publish-crates.yml` (manual retry). See docs/development/releasing.md.
#
# A crate version that is already on crates.io is skipped, so a rerun is safe.
on:
  workflow_call:
    inputs:
      # Passed by cargo-dist to every custom job. Not used here.
      plan:
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-crates
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      # `gh release view` below.
      contents: read
      # Trusted Publishing: exchange the GitHub OIDC token for a short-lived
      # crates.io token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      # Every path (called by release.yml, or run by hand) goes through this
      # check, and it runs before the OIDC token is requested. In a called
      # workflow, `github.ref` is the ref of the calling workflow (the tag).
      - name: Check that this is a stable release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "Not a tag: run this workflow from a release tag, not from a branch." >&2
            exit 1
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "The tag must be a stable version like v1.2.3 (no pre-release suffix)." >&2
            exit 1
          fi
          for crate in translate-kun-core translate-kun; do
            version="$(cargo metadata --no-deps --format-version 1 | jq -r --arg name "$crate" '.packages[] | select(.name == $name) | .version')"
            if [ "$TAG" != "v$version" ]; then
              echo "The tag does not match the version of $crate (v$version)." >&2
              exit 1
            fi
          done
          # A published, non-pre-release GitHub Release must exist for the tag.
          state="$(gh release view "$TAG" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')"
          if [ "$state" != "false false" ]; then
            echo "There is no published, non-pre-release GitHub Release for the tag (draft/prerelease: $state)." >&2
            exit 1
          fi
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Publish translate-kun-core, then translate-kun
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          for crate in translate-kun-core translate-kun; do
            version="$(cargo metadata --no-deps --format-version 1 | jq -r --arg name "$crate" '.packages[] | select(.name == $name) | .version')"
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' --user-agent 'translate-kun-publish-workflow' "https://crates.io/api/v1/crates/$crate/$version")"
            if [ "$status" = "200" ]; then
              echo "$crate $version is already on crates.io: skipping"
            elif [ "$status" = "404" ]; then
              echo "Publishing $crate $version"
              cargo publish -p "$crate" --locked
            else
              echo "Unexpected crates.io answer $status for $crate $version" >&2
              exit 1
            fi
          done
