[package]
name = "kun-core"
description = "Core logic for kun, the translate-kun CLI translator"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
keyring = "4.2.0"
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.1"
ureq = { version = "3.5.2", features = ["json"] }

[features]
# Tests that call real Provider APIs. Never enabled in CI:
# `cargo test -p kun-core --features live`
live = []

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
