[package]
name = "kun"
description = "A command-line translator for developers"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kun"
path = "src/main.rs"

[dependencies]
kun-core = { path = "../kun-core" }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[lints]
workspace = true
