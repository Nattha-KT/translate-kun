name: Feature request
description: Suggest an improvement or a new feature
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please check the README and `docs/requirements.md` first: some things are deliberately out of scope (for example scraping unofficial endpoints, telemetry, or accepting API keys as flags).

        **Never paste API keys or private text.**
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe your situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like `kun` to do?
      description: An example command and the output you would expect helps a lot.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
    validations:
      required: false
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I would be willing to work on this
